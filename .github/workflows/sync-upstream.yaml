name: sync-upstream

# Opens a pull request that merges the latest upstream release of
# fluxcd/source-controller into this fork. The pull request is always opened: if
# the merge has conflicts or the result does not build, CI on it fails and someone
# has to take care of it. See "Maintaining the fork up to date" in the README.
#
# With dry_run, everything happens except pushing the branch and opening the pull
# request, and the result is shown in the job summary.

on:
  schedule:
    # Weekdays, early morning UTC.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to sync, e.g. v1.9.6 (default: the latest stable release)'
        required: false
        type: string
      dry_run:
        description: 'Do not push the branch or open the pull request'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/fluxcd/source-controller.git
  # This repository is a fork: without an explicit repository, gh targets the
  # parent project, and the sync pull requests would open there.
  GH_REPO: ${{ github.repository }}
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  # Scheduled runs skip quietly until the BOT_GITHUB_TOKEN secret exists, instead
  # of failing every weekday. Manual runs fail with a clear error.
  probe:
    if: github.repository_owner == 'qdrant'
    runs-on: ubuntu-latest
    outputs:
      token_available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$BOT_GITHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Sync skipped::The BOT_GITHUB_TOKEN secret is not available, see the README."
          fi

  sync:
    needs: probe
    if: github.event_name != 'schedule' || needs.probe.outputs.token_available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail if the token is missing
        if: env.DRY_RUN != 'true' && needs.probe.outputs.token_available != 'true'
        run: |
          echo "::error title=BOT_GITHUB_TOKEN is not available::No Actions secret named BOT_GITHUB_TOKEN is readable by this run. It must be able to push branches, open pull requests and push changes under .github/workflows/. See the README."
          exit 1

      # The credentials are not persisted: make tidy runs upstream's Makefile, and
      # nothing that runs before the push step can read the token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find the upstream release to sync
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/sync-upstream.sh target "$INPUT_TAG"

      - name: Skip if the sync branch or a pull request already exists
        id: existing
        if: steps.target.outputs.status == 'needs-sync' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          # --state all: a pull request closed without merging is a decision not
          # to take this release, so do not reopen it every morning.
          prs=$(gh pr list --state all --head "$BRANCH" --json number --jq 'length')
          if [ "$prs" != "0" ] || git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch or pull request for $BRANCH already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the upstream release
        id: merge
        if: >-
          steps.target.outputs.status == 'needs-sync' &&
          (env.DRY_RUN == 'true' || steps.existing.outputs.skip == 'false')
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: scripts/sync-upstream.sh merge "$TAG"

      - name: Write the pull request body
        if: steps.merge.outcome == 'success'
        env:
          TAG: ${{ steps.merge.outputs.tag }}
          CONFLICTS_FILE: ${{ steps.merge.outputs.conflicts_file }}
        run: |
          {
            if [ -n "$CONFLICTS_FILE" ]; then
              echo "> **Merge conflicts.** The conflict markers are committed as they are, so CI fails until they are resolved. Conflicting files:"
              echo
              sed 's/^/> - `/; s/$/`/' "$CONFLICTS_FILE"
              echo
            fi
            sed "s|@TAG@|$TAG|g; s|@UPSTREAM@|${UPSTREAM_URL%.git}|g" .github/sync-upstream-pr-body.md
          } > pr-body.md

      - name: Build the result (dry run)
        id: build
        if: env.DRY_RUN == 'true' && steps.merge.outputs.status == 'merged'
        # Informational: a build failure is a property of the upstream release,
        # not of this automation, so it must not fail the dry run.
        continue-on-error: true
        run: go build ./...

      - name: Dry run summary
        if: env.DRY_RUN == 'true' && steps.merge.outcome == 'success'
        env:
          TAG: ${{ steps.merge.outputs.tag }}
          BASE: ${{ steps.merge.outputs.base }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Dry run: sync upstream ${TAG}"
            echo
            echo "Merge status: **${MERGE_STATUS}**. Build after the merge: **${BUILD_OUTCOME}**. Nothing was pushed and no pull request was opened."
            echo
            echo '```'
            git log --first-parent --oneline "${BASE}..HEAD"
            echo '```'
            echo
            echo "### Pull request body"
            echo
            cat pr-body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push branch and open pull request
        if: env.DRY_RUN != 'true' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          TAG: ${{ steps.merge.outputs.tag }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          CONFLICTS_FILE: ${{ steps.merge.outputs.conflicts_file }}
        run: |
          # The only step that gets the token, passed to this one git command.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "$BRANCH"

          draft=()
          if [ -n "$CONFLICTS_FILE" ]; then
            draft=(--draft)
          fi
          gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Sync upstream ${TAG}" \
            --body-file pr-body.md \
            "${draft[@]}"
